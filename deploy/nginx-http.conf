# ACE preview: temporary HTTP-only configuration for certificate issuance.
# Replace this file with nginx-https.conf only after the certificate is ready.
server {
    listen 94.249.186.240:80;
    server_name ace.imon.world;

    autoindex off;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    # The ACME challenge is the only deliberate hidden-path exception.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/imonmeets-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        return 503;
    }
}
