# ACE static preview. No application proxy and no SPA fallback.
server {
    listen 94.249.186.240:80;
    server_name ace.imon.world;

    autoindex off;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    # Keep certificate renewal independent of HTTPS and the preview release.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/imonmeets-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        return 308 https://ace.imon.world$request_uri;
    }
}

server {
    listen 94.249.186.240:443 ssl;
    server_name ace.imon.world;

    ssl_certificate /etc/letsencrypt/live/ace-imon-world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ace-imon-world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/ace-preview/current;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
